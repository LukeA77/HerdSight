# Files each phase's one-time test run depends on. scripts/freeze.py hashes them before the
# test run; the test run checks the hashes first and stops if anything changed.
# Phases are added here as their settings are frozen.
phases:
  # Splits fixed before any model was run (Phase 1 plan); every result records this hash.
  phase1_splits:
    - results/splits.json
    - results/data/icaerus_inventory.json
  # Phase 1 exit (D-31): targets (set by the owner after review), the baseline evidence they were
  # set from, and the evaluation settings they were measured with.
  phase1_specs:
    - configs/specs.yaml
    - results/baselines/spec_baselines.json
    - configs/evaluation.yaml
    - configs/baselines.yaml
    - results/data/s3_truth.json
  # Phase 2 pre-registration (plan step C3): candidates, selection rule, interval settings and
  # hypothesis thresholds, frozen before the first Phase 2 training run.
  phase2_prereg:
    - configs/phase2.yaml
    - configs/specs.yaml
    - configs/evaluation.yaml
  # Phase 3 pre-registration (plan step 2): truth (all 20 verified flights), folds, measure,
  # baseline, solver and descriptor choices and hypothesis rules, frozen before the first run
  # that tests a Phase 3 hypothesis.
  phase3_prereg:
    - configs/phase3.yaml
    - configs/specs.yaml
    - configs/evaluation.yaml
    - results/data/s3_truth.json
    - results/splits.json
  # Phase 7 test run (scripts/phase7_test.py): the final models' hashes and calibration runs, the
  # targets, the evaluation settings, the splits, and the code that predicts and scores. Frozen
  # once the final models exist, before the test farm is read.
  phase7:
    - configs/phase7.yaml
    - configs/specs.yaml
    - configs/evaluation.yaml
    - configs/baselines.yaml
    - results/splits.json
    - scripts/phase7_test.py
    - scripts/score_baseline.py
    - python/herdsight/detect/dfine_onnx.py
    - python/herdsight/detect/run_tiled.py
    - python/herdsight/detect/tiling.py
    - python/herdsight/evaluate/centre_match.py
    - python/herdsight/evaluate/counts.py
    - python/herdsight/evaluate/herds.py
    - python/herdsight/evaluate/stats.py
    - python/herdsight/evaluate/upright_ap.py
  # Phase 7 S4 test run (scripts/run_s4.py --set test): the simulated farms and their seeds, the
  # S4 target, the alert rules, the farm simulator and both measured count errors. Frozen after
  # the validation run with the final count error (results/phase4/s4_validation_final.json),
  # before the test farms are simulated.
  phase7_s4:
    - configs/sim_farms.yaml
    - configs/specs.yaml
    - scripts/run_s4.py
    - python/herdsight/herd/sim.py
    - python/herdsight/herd/alerts.py
    - results/phase3/dfine_ref_s3_v20.json
    - results/baselines/dfine_s3.json
  # Phase 7 simulated counting test (scripts/phase3_sim.py --detector dfine_ref --set test): the
  # simulated worlds and seeds, the counting settings, the final detector's real-flight pair model
  # summary and ranges, the detection error model, and the simulation and counting code. Frozen
  # after the simulated validation run with the final detector, before the test seed is flown.
  phase7_s3:
    - configs/sim_worlds.yaml
    - configs/phase3.yaml
    - configs/mission.yaml
    - scripts/phase3_sim.py
    - results/phase3/pair_model_dfine_ref.json
    - results/phase3/ranges_real_dfine_ref.json
    - results/data/detection_error_model.json
    - results/data/flight_error_model.json
    - python/herdsight/sim/flight.py
    - python/herdsight/sim/phase3.py
    - python/herdsight/sim/herds.py
    - python/herdsight/sim/errors.py
    - python/herdsight/count/ranges.py
    - python/herdsight/count/clustering.py
    - python/herdsight/count/evidence.py
