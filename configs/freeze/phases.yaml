# Files each phase's one-time test run depends on. scripts/freeze.py hashes them before the
# test run; the test run checks the hashes first and stops if anything changed.
# Phases are added here as their settings are frozen.
phases:
  # Splits fixed before any model was run (Phase 1 plan); every result records this hash.
  phase1_splits:
    - results/splits.json
    - results/data/icaerus_inventory.json
  # Phase 1 exit (D-31): targets (set by the owner after review), the baseline evidence they were
  # set from, and the evaluation settings they were measured with.
  phase1_specs:
    - configs/specs.yaml
    - results/baselines/spec_baselines.json
    - configs/evaluation.yaml
    - configs/baselines.yaml
    - results/data/s3_truth.json
  # Phase 2 pre-registration (plan step C3): candidates, selection rule, interval settings and
  # hypothesis thresholds, frozen before the first Phase 2 training run.
  phase2_prereg:
    - configs/phase2.yaml
    - configs/specs.yaml
    - configs/evaluation.yaml
  # Phase 3 pre-registration (plan step 2): truth (all 20 verified flights), folds, measure,
  # baseline, solver and descriptor choices and hypothesis rules, frozen before the first run
  # that tests a Phase 3 hypothesis.
  phase3_prereg:
    - configs/phase3.yaml
    - configs/specs.yaml
    - configs/evaluation.yaml
    - results/data/s3_truth.json
    - results/splits.json
