name: sim-mission

# One simulated survey mission (PX4 SITL + Gazebo + ROS 2), counted at home base and judged by the
# S5 checks. Started by hand (Actions tab -> sim-mission -> Run workflow), never on push, so the
# fast checks in ci.yml stay fast. It pulls the prebuilt simulation image from the GitHub container
# registry (built from sim/docker/Dockerfile and pushed once; building PX4 here would take hours).
# Simulation only: a pass shows the mission chain works; it is not a field result.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Simulation image (registry path and tag)"
        default: "ghcr.io/lukea77/herdsight-sim:dev"
      seed:
        description: "World seed"
        default: "0"

permissions:
  contents: read
  packages: read

jobs:
  mission:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the 10 GB image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Pull the simulation image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${{ inputs.image }}"
      - name: Build the mission packages
        run: |
          docker volume create hs_ros_ws
          docker run --rm -v "$PWD:/repo:ro" -v hs_ros_ws:/ws "${{ inputs.image }}" bash -c \
            "mkdir -p /ws/src && cp -r /repo/ros2/herdsight_mission /repo/ros2/herdsight_msgs /ws/src/ \
             && cd /ws && . /opt/ros/jazzy/setup.sh && . /opt/px4_ws/install/setup.sh \
             && colcon build --packages-select herdsight_msgs herdsight_mission \
                --cmake-args -DCMAKE_BUILD_TYPE=Release"
      - name: Fly one survey
        run: |
          mkdir -p flight
          docker run --rm -e BBOX=1 -v "$PWD:/repo:ro" -v hs_ros_ws:/ws -v "$PWD/flight:/out" \
            "${{ inputs.image }}" bash /repo/sim/bridge/run_flight.sh 1200 "${{ inputs.seed }}" \
            | tee flight/console.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Count at home base and check (S5)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
          sudo chown -R "$USER" flight
          python scripts/check_s5_flights.py --run normal=complete=flight --out flight/s5_checks.json
      - name: Keep the flight logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-mission-seed-${{ inputs.seed }}
          path: |
            flight/*.json
            flight/*.log
            flight/*.txt
            flight/*.csv
            flight/plan.yaml
          retention-days: 14
