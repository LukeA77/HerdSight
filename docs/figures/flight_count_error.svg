<svg xmlns='http://www.w3.org/2000/svg' width='720' height='400' viewBox='0 0 720 400' font-family='Helvetica, Arial, sans-serif'>
<rect width='720' height='400' fill='white'/>
<text x='70.0' y='30.0' font-size='17' fill='#1f2933' text-anchor='start' font-weight='bold'>Whole-flight count error, 20 hand-verified flights</text>
<text x='70.0' y='50.0' font-size='12' fill='#616e7c' text-anchor='start' font-weight='normal'>Mean error against the true count, final detector. Bars above 100% are cut off. Public data.</text>
<line x1='70' x2='690' y1='320.0' y2='320.0' stroke='#d9dee3'/>
<text x='62.0' y='324.0' font-size='11' fill='#616e7c' text-anchor='end' font-weight='normal'>0%</text>
<line x1='70' x2='690' y1='270.0' y2='270.0' stroke='#d9dee3'/>
<text x='62.0' y='274.0' font-size='11' fill='#616e7c' text-anchor='end' font-weight='normal'>20%</text>
<line x1='70' x2='690' y1='220.0' y2='220.0' stroke='#d9dee3'/>
<text x='62.0' y='224.0' font-size='11' fill='#616e7c' text-anchor='end' font-weight='normal'>40%</text>
<line x1='70' x2='690' y1='170.0' y2='170.0' stroke='#d9dee3'/>
<text x='62.0' y='174.0' font-size='11' fill='#616e7c' text-anchor='end' font-weight='normal'>60%</text>
<line x1='70' x2='690' y1='120.0' y2='120.0' stroke='#d9dee3'/>
<text x='62.0' y='124.0' font-size='11' fill='#616e7c' text-anchor='end' font-weight='normal'>80%</text>
<line x1='70' x2='690' y1='70.0' y2='70.0' stroke='#d9dee3'/>
<text x='62.0' y='74.0' font-size='11' fill='#616e7c' text-anchor='end' font-weight='normal'>100%</text>
<rect x='101.5' y='70.0' width='42.0' height='250.0' fill='#2f6fb0' rx='2'/>
<text x='122.5' y='64.0' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>248%</text>
<rect x='147.5' y='70.0' width='42.0' height='250.0' fill='#3c8d5a' rx='2'/>
<text x='168.5' y='64.0' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>266%</text>
<text x='147.5' y='340.0' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='normal'>Add up every photo</text>
<rect x='256.5' y='219.1' width='42.0' height='100.9' fill='#2f6fb0' rx='2'/>
<text x='277.5' y='213.1' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>40%</text>
<rect x='302.5' y='254.5' width='42.0' height='65.5' fill='#3c8d5a' rx='2'/>
<text x='323.5' y='248.5' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>26%</text>
<text x='302.5' y='340.0' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='normal'>Match by GPS tag</text>
<rect x='411.5' y='253.2' width='42.0' height='66.8' fill='#2f6fb0' rx='2'/>
<text x='432.5' y='247.2' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>27%</text>
<rect x='457.5' y='283.8' width='42.0' height='36.2' fill='#3c8d5a' rx='2'/>
<text x='478.5' y='277.8' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>14%</text>
<text x='457.5' y='340.0' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='normal'>Match by image alignment</text>
<rect x='566.5' y='257.2' width='42.0' height='62.8' fill='#2f6fb0' rx='2'/>
<text x='587.5' y='251.2' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>25%</text>
<rect x='612.5' y='288.8' width='42.0' height='31.2' fill='#3c8d5a' rx='2'/>
<text x='633.5' y='282.8' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>12%</text>
<text x='612.5' y='340.0' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='normal'>Final method</text>
<line x1='70' x2='690' y1='282.5' y2='282.5' stroke='#c0392b' stroke-dasharray='6 4' stroke-width='1.5'/>
<text x='690.0' y='380.0' font-size='12' fill='#c0392b' text-anchor='end' font-weight='normal'>- - target 15%</text>
<rect x='70' y='370' width='12' height='12' fill='#2f6fb0' rx='2'/>
<text x='88.0' y='380.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>With the final detector</text>
<rect x='272.5' y='370' width='12' height='12' fill='#3c8d5a' rx='2'/>
<text x='290.5' y='380.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>With perfect detections</text>
</svg>
