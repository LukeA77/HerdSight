<svg xmlns='http://www.w3.org/2000/svg' width='720' height='330' viewBox='0 0 720 330' font-family='Helvetica, Arial, sans-serif'>
<rect width='720' height='330' fill='white'/>
<text x='30.0' y='30.0' font-size='17' fill='#1f2933' text-anchor='start' font-weight='bold'>Where the drone lands after losing GPS</text>
<text x='30.0' y='50.0' font-size='12' fill='#616e7c' text-anchor='start' font-weight='normal'>Distance from the launch point, log scale. Simulation (PX4 and Gazebo).</text>
<line x1='210.0' x2='210.0' y1='70' y2='270' stroke='#d9dee3'/>
<text x='210.0' y='288.0' font-size='11' fill='#616e7c' text-anchor='middle' font-weight='normal'>0.1 m</text>
<line x1='315.0' x2='315.0' y1='70' y2='270' stroke='#d9dee3'/>
<text x='315.0' y='288.0' font-size='11' fill='#616e7c' text-anchor='middle' font-weight='normal'>1 m</text>
<line x1='420.0' x2='420.0' y1='70' y2='270' stroke='#d9dee3'/>
<text x='420.0' y='288.0' font-size='11' fill='#616e7c' text-anchor='middle' font-weight='normal'>10 m</text>
<line x1='525.0' x2='525.0' y1='70' y2='270' stroke='#d9dee3'/>
<text x='525.0' y='288.0' font-size='11' fill='#616e7c' text-anchor='middle' font-weight='normal'>100 m</text>
<line x1='630.0' x2='630.0' y1='70' y2='270' stroke='#d9dee3'/>
<text x='630.0' y='288.0' font-size='11' fill='#616e7c' text-anchor='middle' font-weight='normal'>1000 m</text>
<text x='198.0' y='95.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Blind descent, calm</text>
<rect x='210' y='80' width='346.3' height='22' fill='#c0392b' rx='2'/>
<text x='562.3' y='95.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>199 m</text>
<text x='198.0' y='141.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Camera return, calm</text>
<rect x='210' y='126' width='29.2' height='22' fill='#3c8d5a' rx='2'/>
<text x='245.2' y='141.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>0.2 m</text>
<text x='198.0' y='187.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Blind descent, 5 m/s wind</text>
<rect x='210' y='172' width='415.5' height='22' fill='#c0392b' rx='2'/>
<text x='631.5' y='187.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>906 m</text>
<text x='198.0' y='233.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Camera return, 5 m/s wind</text>
<rect x='210' y='218' width='193.9' height='22' fill='#3c8d5a' rx='2'/>
<text x='409.9' y='233.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>7.0 m</text>
<text x='30.0' y='318.0' font-size='11' fill='#616e7c' text-anchor='start' font-weight='normal'>In 10 m/s wind the blind descent left the simulated ground; see the camera return section for the 10 m/s result.</text>
</svg>
